<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home-Permify</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Yuyu&display=swap"
        rel="stylesheet">
    <style type="text/tailwindcss">
        @theme {
            --font-comfortaa: "Comfortaa", sans-serif;
            --color-mutedteal: #005A60;
            --font-yuyu: "Yuyu", sans-serif;
        }
        @layer utilities {
            .text-shadow-pink {
                text-shadow: 0 2px 5px rgba(157, 23, 77, 0.71);
            }
            .text-shadow-white {
                text-shadow: 0 2px 5px rgba(254, 254, 254, 0.71);
            }
        }
        @layer componenets {
            .selected {
                @apply underline font-bold;
            }
        }
    </style>
</head>

<body class="hidden">
    <nav class="bg-teal-100 p-4 shadow-md w-full">
        <div class="mx-auto flex justify-between items-center flex-col gap-2 sm:flex-row">
            <div class="flex items-center gap-1">
                <img class="h-9" src="../Assets/127756-alphabet-neon-free-download-image.png" alt="Permify-logo">
                <a class="text-mutedteal text-4xl font-bold">P<span
                        class="font-comfortaa text-2xl text-shadow-pink">ermify</span>
                </a>
            </div>

            <ul class="flex gap-10 md:gap-6 text-mutedteal transition">
                <li><a class="hover:font-bold selected" href="#home">Home</a></li>
                <li><a class="hover:font-bold" href="#producs">Products</a></li>
                <li><a class="hover:font-bold" href="#about">About</a></li>
            </ul>
            <div class="flex flex-row gap-2 items-between justify-center">
                <button
                    class="bg-mutedteal py-1 px-5 border-1 rounded-md font-semibold border-mutedteal hover:scale-103 text-white shadow-md hover:shadow-lg hover:bg-mutedteal/90"
                    id="logout-btn">Logout</button>
                <button
                    class="bg-black rounded-full overflow-hidden flex items-center justify-center hover:shadow-md hover:scale-105 w-9 border-2 border-mutedteal h-9 shadow-md hover:shadow-lg"><img
                        src="" alt="Avatar" class="object-cover" id="avatar"></button>
            </div>
        </div>
    </nav>
    <main>
        <div id="home"
            class="bg-[url('../assets/johny-goerend-Oz2ZQ2j8We8-unsplash.jpg')] bg-cover bg-center bg-fixed h-120 flex flex-col p-8 justify-center items-center text-center gap-1">
            <h2 class="text-white font-extrabold text-5xl text-shadow-pink">Welcome to <span
                    class="text-pink-300">our</span> website <span class="text-pink-300" id="name-show"></span> !</h2>
            <p class="font-comfortaa text-white text-shadow-pink text-lg">Manage user accounts using crud functions
            </p>
            <div class="flex flex-row justify-center items-center">
                <button class="bg-white/80 py-3 px-5 mt-4 rounded-md border border-mutedteal text-mutedteal font-semibold hover:bg-white/95 hover:scale-105 shadow-md hover:shadow-lg">
                    <a href="dashboard.html">Go to Dashboard</a>
                </button>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <script src="../scripts/api.js"></script>
    <script src="../scripts/home.js"></script>
</body>

</html>
