<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home-Permify</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Yuyu&display=swap"
        rel="stylesheet">
    <style type="text/tailwindcss">
        @theme {
            --font-comfortaa: "Comfortaa", sans-serif;
            --color-mutedteal: #005A60;
            --font-yuyu: "Yuyu", sans-serif;
        }
        @layer utilities {
            .text-shadow-pink {
                text-shadow: 0 2px 5px rgba(157, 23, 77, 0.71);
            }
            .text-shadow-white {
                text-shadow: 0 2px 5px rgba(254, 254, 254, 0.71);
            }
        }
    </style>
</head>

<body>
    <nav class="bg-teal-100 p-4 shadow-md w-full">
        <div class="mx-auto flex justify-between items-center flex-col gap-2 sm:flex-row">
            <div class="flex items-center gap-1">
                <img class="h-9" src="../Assets/127756-alphabet-neon-free-download-image.png" alt="Permify-logo">
                <a class="text-mutedteal text-4xl font-bold">P<span
                        class="font-comfortaa text-2xl text-shadow-pink">ermify</span>
                </a>
            </div>

            <ul class="flex gap-10 md:gap-6 text-mutedteal transition">
                <li><a class="hover:underline hover:font-bold underline font-bold" href="#">Home</a></li>
                <li><a class="hover:font-bold" href="#">Products</a></li>
                <li><a class="hover:font-bold" href="#">About</a></li>
            </ul>
            <div class="flex flex-row gap-2 items-between justify-center">
                <button
                    class="bg-transparent py-1 px-5 border-1 rounded-md text-mutedteal font-semibold border-mutedteal hover:bg-mutedteal/90 hover:scale-105 hover:text-white">Logout</button>
                    <button class="bg-black rounded-full overflow-hidden flex items-center justify-center hover:shadow-md hover:scale-105 w-9 border-2 border-mutedteal h-9 shadow-md hover:shadow-lg"><img src="../assets/luthfi-alfarizi-gEf9bOMTZtk-unsplash.webp" alt="" class="object-cover" id="avatar"></button>
            </div>
        </div>
    </nav>
    <main>
        <div class="bg-[url('../assets/johny-goerend-Oz2ZQ2j8We8-unsplash.jpg')] bg-cover bg-center bg-fixed h-100 flex flex-col p-8 justify-center items-center gap-1">
            <h2 class="text-white font-extrabold text-5xl text-shadow-pink">Welcome to <span
                    class="text-pink-300">our</span> website!</h2>
            <p class="font-comfortaa text-pink-300 text-shadow-white text-lg">Manage user accounts using crud functions
            </p>
        </div>
        <section class="flex flex-col justify-center items-center bg-gray-100 w-full px-20 py-10 gap-4">
            <form action="" class="self-end">
                <input type="text" placeholder="Search" class="p-2 border-1 rounded-md shadow-md border-pink-800">
                <button type="submit" class="bg-pink-800 text-white p-2 border-1 border-pink-800 rounded-md shadow-md hover:bg-pink/30 hover:shadow-lg hover:scale-105"><i class="fa-solid fa-search mx-1"></i></button>
            </form>
            <div class="border rounded-md border-gray-400 w-full overflow-hidden">
                <table class="w-full">
                <thead class="bg-mutedteal text-white">
                    <th class="border border-gray-300 py-2 text-center">ID</th>
                    <th class="border border-gray-300 py-2 text-center">Username</th>
                    <th class="border border-gray-300 py-2 text-center">Email</th>
                    <th class="border border-gray-300 py-2 text-center">Role</th>
                </thead>
                <tbody>
                    <tr class="bg-white">
                        <td class="border border-gray-300 p-2">aliusman</td>
                        <td class="border border-gray-300 p-2">aliusman@gmail.com</td>
                        <td class="border border-gray-300 p-2 rounded-md">Moderator</td>
                    </tr>
                    <tr class="bg-gray-200">
                        <td class="border border-gray-300 p-2">aliasif</td>
                        <td class="border border-gray-300 p-2">aliasif@gmail.com</td>
                        <td class="border border-gray-300 p-2">Admin</td>
                    </tr>
                </tbody>
            </div>
            </table>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <script src="../scripts/api.js"></script>
    <script src="../scripts/home.js"></script>
</body>

</html>
